
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美國天天樂 539 AI 預測 App</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef4fa;
color:#18334c;
font-family:Arial,"Noto Sans TC",sans-serif;
}

header{
background:#164d78;
color:white;
text-align:center;
padding:22px 12px;
}

h1{font-size:24px;margin:0 0 8px}

main{
max-width:850px;
margin:auto;
padding:12px;
}

.card{
background:white;
border-radius:12px;
padding:16px;
margin:12px 0;
box-shadow:0 2px 8px #0001;
}

h2{font-size:19px}

button{
background:#17679c;
color:white;
border:0;
border-radius:8px;
padding:11px 14px;
margin:5px 3px;
font-size:15px;
cursor:pointer;
}

input,select{
padding:10px;
margin:5px 2px;
border:1px solid #ccc;
border-radius:7px;
max-width:100%;
}

input[type=number]{width:65px}

.ball{
display:inline-flex;
align-items:center;
justify-content:center;
width:40px;
height:40px;
background:#17679c;
color:white;
border-radius:50%;
margin:4px;
font-weight:bold;
}

.small{font-size:13px;color:#64748b}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

td,th{
border-bottom:1px solid #ddd;
padding:8px;
text-align:center;
}

.scroll{overflow-x:auto}

.result{
background:#edf7ff;
padding:12px;
border-radius:10px;
margin:10px 0;
}

textarea{
width:100%;
height:110px;
}

</style>
</head>
